spring.application.name=qturn
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/qturn_db}
spring.datasource.username=${DB_USERNAME:qturn}
spring.datasource.password=${DB_PASSWORD:qturn}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jackson.time-zone=America/Argentina/Buenos_Aires

security.jwt.token.secret-key=${JWT_SECRET}
management.endpoints.web.exposure.include=health,info
